[package]
distribution = "2201.12.0"
org = "xlibb"
name = "pdfbox"
version = "1.0.1"
license = ["Apache-2.0"]
authors = ["Ballerina"]
keywords = ["pdfbox"]
icon = "icon.png"
repository = "https://github.com/xlibb/module-pdfbox"

[build-options]
observabilityIncluded = true

[[platform.java21.dependency]]
groupId = "io.xlibb.pdfbox"
artifactId = "pdfbox-native"
version = "1.0.1"
path = "../native/build/libs/pdfbox-native-1.0.1.jar"

[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "pdfbox"
version = "3.0.5"

[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "fontbox"
version = "3.0.5"

[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "pdfbox-io"
version = "3.0.5"
